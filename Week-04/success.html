<html>
    <head>
        <title>Success-Page</title>
        <meta charset="UTF-8">
        <style>
            body{
                background-color: aliceblue;
                background-image: url("image.jpg");
            }

            .heading{
                height: 200px;
                align-items: center;
            }

            .heading img{
                height: 100px;
                width: 100px;
                margin-left: 80px;
                display: inline;
            }

            .text{
                align-items: center;
                display: flex;
                flex-direction: column;
                color: azure;
                position: absolute;
                top: 0px;
                left: 550px;
            }

            .navbar{
                height: 50px;
                display: flex;
                flex-direction: row;
                justify-content: space-around;
                background-color:  purple;
            }

            a{
                color: white;
                text-decoration: none;
                margin-top: 10px;
            }

            .box{
                margin-top: 50px;
                height:500px;
                width: 600px;
                margin-left: auto;
                margin-right: auto;
                background-color: lightblue;
                box-shadow: 10px 10px 10px grey;
                display: flex;
                flex-direction: column;
                justify-content: space-around;
            }

            .inner{
                background-color: aliceblue;
                border-left: 2px solid yellow;
                margin-left: auto;
                margin-right: auto;
            }

            li{
                margin-left: auto;
                margin-right: auto;
                color: blue;
                margin-left: 8px;
            }

            #greeting{
                color: blue;
            }

            #loginTime{
                color: blue;
            }
        </style>
    </head>

    <header>
        <div class="heading">
            <img src="logo.png" alt="Logo">
            <div class="text">
            <h1>Anil Neerukonda Institute of Technology & Sciences</h1>
            <h2>Campus Placement Portal</h2>
            </div>
        </div>
    </header>
        <div class="navbar">
            <a href="#">Home</a>
            <a href="#">About</a>
            <a href="#">Apply Job</a>
            <a href="#">UpComing Placements</a>
            <a href="#">Contact</a>
        </div>
    
    <body>
        <div class="box">
            <h2 style="color: green; margin-left: 5px;">Login Successful!</h2>
            <p style="color: darkblue;margin-left: 5px;">Welcome to ANITS Central Placement Portal</p>
            <p id="loginTime"></p>
            <p id="greeting"></p>
        </div>
        <script>
            let now=new Date();
            let hours=now.getHours();
            let greet="";
            
            if(hours<12){
                greet="Good Morning!";
            }

            else if(hours<17){
                greet="Good Afternoon!";
            }

            else if(hours<21){
                greet="Good Evening!";
            }

            else{
                greet="Good Night!"
            }

            document.getElementById("greeting").innerHTML=greet;
            document.getElementById("loginTime").innerHTML="Login Time :"+now.toLocaleTimeString();
        </script>
    </body>
</html>
