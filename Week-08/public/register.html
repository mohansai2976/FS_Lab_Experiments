<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register - BusGo</title><link rel="stylesheet" href="css/style.css">
</head>
<body>
<header><nav class="navbar"><a class="brand" href="index.html">🚌 BusGo</a><div><a href="index.html">Home</a><a href="login.html">Login</a></div></nav></header>
<main class="form-page">
<div class="form-card">
<h2>Create your account</h2><p>Register to start booking buses.</p>
<form id="registerForm">
<div class="grid">
<label>Name *<input name="name" required></label>
<label>Age<input type="number" name="age" min="1" max="100"></label>
<label>Date of Birth<input type="date" name="dob"></label>
<label>Gender<select name="gender"><option value="">Select</option><option>Male</option><option>Female</option><option>Other</option></select></label>
<label>Email *<input type="email" name="email" required></label>
<label>Mobile Number *<input name="mobile" pattern="[0-9]{10}" maxlength="10" required></label>
<label>Username *<input name="username" required></label>
<label>Password *<input type="password" name="password" minlength="6" required></label>
</div>
<label>Address<textarea name="address" rows="3"></textarea></label>
<button class="btn primary full" type="submit">Register</button>
<p id="message" class="message"></p>
</form>
<p>Already registered? <a href="login.html">Login here</a></p>
</div>
</main>
<script src="js/script.js"></script>
</body>
</html>
