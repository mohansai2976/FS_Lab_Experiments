<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - BankEase</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <nav class="navbar">
    <a class="logo" href="/">BankEase</a>
    <div>
      <a class="nav-link" href="/">Home</a>
      <a class="nav-link active" href="/register">Register</a>
      <a class="nav-link" href="/login">Login</a>
    </div>
  </nav>

  <main class="form-page">
    <div class="form-card wide">
      <div class="form-heading">
        <p class="eyebrow">JOIN BANKEASE</p>
        <h1>Create your account</h1>
        <p>Enter your details to register for online banking.</p>
      </div>

      <form action="/register" method="POST" onsubmit="return validateRegistration()">
        <div class="form-grid">
          <div class="input-group">
            <label for="name">Full Name *</label>
            <input type="text" id="name" name="name" placeholder="Enter full name" required>
          </div>

          <div class="input-group">
            <label for="age">Age</label>
            <input type="number" id="age" name="age" min="1" max="120" placeholder="Enter age">
          </div>

          <div class="input-group">
            <label for="dob">Date of Birth</label>
            <input type="date" id="dob" name="dob">
          </div>

          <div class="input-group">
            <label for="gender">Gender</label>
            <select id="gender" name="gender">
              <option value="">Select gender</option>
              <option>Male</option>
              <option>Female</option>
              <option>Other</option>
            </select>
          </div>

          <div class="input-group">
            <label for="email">Email *</label>
            <input type="email" id="email" name="email" placeholder="example@email.com" required>
          </div>

          <div class="input-group">
            <label for="mobile">Mobile Number</label>
            <input type="tel" id="mobile" name="mobile" placeholder="10-digit mobile number">
          </div>

          <div class="input-group">
            <label for="username">Username *</label>
            <input type="text" id="username" name="username" placeholder="Choose username" required>
          </div>

          <div class="input-group">
            <label for="password">Password *</label>
            <input type="password" id="password" name="password" placeholder="Create password" required>
          </div>

          <div class="input-group full">
            <label for="address">Address</label>
            <textarea id="address" name="address" rows="3" placeholder="Enter your address"></textarea>
          </div>
        </div>

        <button class="btn full-btn" type="submit">Register Account</button>
      </form>

      <p class="form-footer">Already registered? <a href="/login">Login here</a></p>
    </div>
  </main>

  <script src="/js/script.js"></script>
</body>
</html>
